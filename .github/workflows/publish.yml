name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          package_name="$(node -p "require('./package.json').name")"
          expected_tag="v${version}"

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi

          npm_version="$(npm --version)"
          NPM_VERSION="$npm_version" node -e '
            const [major, minor, patch] = process.env.NPM_VERSION.split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error(`npm ${process.env.NPM_VERSION} does not support trusted publishing`);
            }
          '

          git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "Release commit is not on $DEFAULT_BRANCH" >&2
            exit 1
          fi

          if npm view "${package_name}@${version}" version --json >/dev/null 2>&1; then
            echo "${package_name}@${version} is already published" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run mutate
      - uses: osolmaz/slophammer@main
        with:
          checker: ts
          version: 0.4.0
      - run: npm pack --dry-run --json
      - run: npm publish --provenance
